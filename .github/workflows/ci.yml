name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install alsa-utils (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y alsa-utils

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Byte-compile check
        run: uv run python -m py_compile main.py location.py prayer_times.py mute.py

      - name: Import smoke test
        run: uv run python -c "import location, prayer_times, mute, main; print('imports OK on', __import__('platform').system())"
