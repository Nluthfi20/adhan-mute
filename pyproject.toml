[project]
name = "adhan-mute"
version = "0.1.0"
description = "Mutes your music at adhan time so you can actually hear the call to prayer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
]

[project.scripts]
adhan-mute = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
